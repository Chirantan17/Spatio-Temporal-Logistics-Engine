services:
  db:
    image: postgis/postgis:15-3.3
    container_name: spatio-temporal-logistics-engine-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_engine:/var/lib/postgresql/data

volumes:
  pgdata_engine:
